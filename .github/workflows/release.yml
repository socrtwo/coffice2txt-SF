name: Build & publish multi-platform release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (tag, branch, or SHA) to build. Leave blank to use the workflow ref.'
        required: false
        default: ''
      tag:
        description: 'Tag to release (e.g. v1.0.4). Leave blank to derive from the checked-out ref/VERSION.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build platform bundles
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] && [ -z "${{ inputs.ref }}" ]; then
            tag="${GITHUB_REF_NAME}"
          elif [ -n "${{ inputs.tag }}" ]; then
            tag="${{ inputs.tag }}"
          elif [ -n "${{ inputs.ref }}" ] && [[ "${{ inputs.ref }}" == v* ]]; then
            tag="${{ inputs.ref }}"
          else
            tag="v$(cat VERSION 2>/dev/null || echo 0.0.0)-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $tag"

      - name: Lint Perl files
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y perl
          errors=0
          while IFS= read -r f; do
            echo "  perl -c $f"
            perl -c "$f" || errors=$((errors + 1))
          done < <(find . -type f \( -name '*.pl' -o -name '*.pm' \) ! -path './.git/*')
          if [ "$errors" -gt 0 ]; then
            echo "::warning::$errors file(s) had Perl syntax issues"
          fi

      - name: Build platform bundles
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail

          mkdir -p dist staging
          base="coffice2txt-${VERSION}"

          payload=(
            coffice2txt.pl coffice2txtworking.pl
            ParseExcel.pm ReadPDP.pm TempFolderCreator.pm
            Utility2007PDP.pm ZipMod2.pm
            ss2tk test.pl xlscatPDP
            Spreadsheet-XLSX-TempFolderCreator
            Spreadsheet-XLSX-Utility2007PDP
            Spreadsheet-XLSX-ZipMod2
            LICENSE README.md CHANGELOG.md VERSION cpanfile
          )

          stage_common() {
            local dest="$1"
            mkdir -p "$dest"
            for f in "${payload[@]}"; do
              if [ -e "$f" ]; then
                cp -r "$f" "$dest/"
              fi
            done
          }

          # ---- Linux ----
          dir="staging/${base}-linux"
          stage_common "$dir"
          cp scripts/run.sh "$dir/run.sh"
          chmod +x "$dir/run.sh"
          tar -czf "dist/${base}-linux.tar.gz" -C staging "$(basename "$dir")"

          # ---- macOS ----
          dir="staging/${base}-macos"
          stage_common "$dir"
          cp scripts/run.command "$dir/run.command"
          chmod +x "$dir/run.command"
          tar -czf "dist/${base}-macos.tar.gz" -C staging "$(basename "$dir")"

          # ---- Windows (staged only; signing + zip happens in sign-windows job) ----
          dir="staging/${base}-windows"
          stage_common "$dir"
          cp scripts/run.bat "$dir/run.bat"

          # ---- ChromeOS (Crostini = Linux) ----
          dir="staging/${base}-chromeos"
          stage_common "$dir"
          cp scripts/run.sh "$dir/run.sh"
          chmod +x "$dir/run.sh"
          tar -czf "dist/${base}-chromeos.tar.gz" -C staging "$(basename "$dir")"

          # ---- Android (Termux) ----
          dir="staging/${base}-android"
          stage_common "$dir"
          cp scripts/setup-termux.sh "$dir/setup-termux.sh"
          chmod +x "$dir/setup-termux.sh"
          tar -czf "dist/${base}-android.tar.gz" -C staging "$(basename "$dir")"

          # ---- iOS (a-Shell / iSH) ----
          dir="staging/${base}-ios"
          stage_common "$dir"
          cp scripts/setup-ish.sh "$dir/setup-ish.sh"
          chmod +x "$dir/setup-ish.sh"
          tar -czf "dist/${base}-ios.tar.gz" -C staging "$(basename "$dir")"

          # ---- Web ----
          dir="staging/${base}-web"
          mkdir -p "$dir"
          cp -r web/. "$dir/"
          cp LICENSE README.md "$dir/"
          (cd staging && zip -qr "../dist/${base}-web.zip" "$(basename "$dir")")

          # ---- Source archives ----
          git archive --format=tar.gz --prefix="${base}/" -o "dist/${base}-source.tar.gz" HEAD
          git archive --format=zip   --prefix="${base}/" -o "dist/${base}-source.zip"   HEAD

          ls -la dist/
          ls -la staging/

      - name: Upload non-windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-nonwindows
          path: dist/

      - name: Upload unsigned windows staging
        uses: actions/upload-artifact@v4
        with:
          name: windows-staging-unsigned
          path: staging/coffice2txt-${{ steps.ver.outputs.version }}-windows

  sign-windows:
    name: Sign Windows binaries and package
    needs: build
    runs-on: windows-latest
    outputs:
      tag: ${{ needs.build.outputs.tag }}
      version: ${{ needs.build.outputs.version }}
    steps:
      - name: Download unsigned windows staging
        uses: actions/download-artifact@v4
        with:
          name: windows-staging-unsigned
          path: staging/coffice2txt-${{ needs.build.outputs.version }}-windows

      - name: Sign Windows binaries (Azure Trusted Signing)
        uses: azure/trusted-signing-action@v0.5.1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
          files-folder: staging/coffice2txt-${{ needs.build.outputs.version }}-windows
          files-folder-filter: exe,msi,dll
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Package signed windows zip
        shell: pwsh
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $base = "coffice2txt-$env:VERSION-windows"
          Compress-Archive -Path "staging/$base" -DestinationPath "dist/$base.zip" -Force
          Get-ChildItem dist

      - name: Upload signed windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows-signed
          path: dist/

  release:
    name: Publish GitHub Release
    needs: [build, sign-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag != '' || github.event.inputs.ref != ''
    steps:
      - name: Download non-windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-nonwindows
          path: dist

      - name: Download signed windows artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-windows-signed
          path: dist

      - name: Recompute SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          rm -f SHA256SUMS.txt
          sha256sum $(ls | grep -v '^SHA256SUMS\.txt$') > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: Coffice2txt ${{ needs.build.outputs.tag }}
          generate_release_notes: true
          body: |
            Multi-platform release of Coffice2txt ${{ needs.build.outputs.tag }}.

            See [`CHANGELOG.md`](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.

            ## Bundles

            | Platform | File |
            |---|---|
            | Windows  | `coffice2txt-${{ needs.build.outputs.version }}-windows.zip` |
            | macOS    | `coffice2txt-${{ needs.build.outputs.version }}-macos.tar.gz` |
            | Linux    | `coffice2txt-${{ needs.build.outputs.version }}-linux.tar.gz` |
            | ChromeOS | `coffice2txt-${{ needs.build.outputs.version }}-chromeos.tar.gz` |
            | Android  | `coffice2txt-${{ needs.build.outputs.version }}-android.tar.gz` |
            | iOS      | `coffice2txt-${{ needs.build.outputs.version }}-ios.tar.gz` |
            | Web      | `coffice2txt-${{ needs.build.outputs.version }}-web.zip` |

            SHA-256 checksums for every artifact are in `SHA256SUMS.txt`.
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
